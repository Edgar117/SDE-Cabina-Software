<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1800" viewBox="0 0 600 1800">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8841A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Brillo en marcos (sutil, las fotos ya tienen borde) -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.35" filter="url(#goldGlow)">
    <rect x="40" y="174" width="520" height="352"/>
    <rect x="40" y="549" width="520" height="352"/>
    <rect x="40" y="924" width="520" height="352"/>
  </g>

  <!-- Corona -->
  <g transform="translate(300,1295)" fill="url(#gold)" stroke="#9A7B1A" stroke-width="0.8">
    <path d="M-48,4 L-36,-22 L-22,-6 L0,-32 L22,-6 L36,-22 L48,4 L44,14 L-44,14Z"/>
    <circle cx="-32" cy="-14" r="3.5" fill="#FFF9E6"/>
    <circle cx="0" cy="-24" r="4.5" fill="#FFF9E6"/>
    <circle cx="32" cy="-14" r="3.5" fill="#FFF9E6"/>
    <rect x="-44" y="12" width="88" height="7" rx="2"/>
  </g>

  <!-- Mariposas -->
  <g fill="#C41E3A" opacity="0.8">
    <g transform="translate(188,1325)">
      <ellipse cx="-9" cy="0" rx="11" ry="15" transform="rotate(-28 -9 0)"/>
      <ellipse cx="9" cy="0" rx="11" ry="15" transform="rotate(28 9 0)"/>
      <ellipse cx="0" cy="1" rx="2.5" ry="9" fill="#8B1530"/>
    </g>
    <g transform="translate(412,1325)">
      <ellipse cx="-9" cy="0" rx="11" ry="15" transform="rotate(-28 -9 0)"/>
      <ellipse cx="9" cy="0" rx="11" ry="15" transform="rotate(28 9 0)"/>
      <ellipse cx="0" cy="1" rx="2.5" ry="9" fill="#8B1530"/>
    </g>
  </g>
</svg>
